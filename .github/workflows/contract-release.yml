name: Attest escrow source
on:
  workflow_dispatch:
  push:
    branches: [main, codex/feedback-hardening]
    paths:
      - 'contracts/invoice-escrow/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/contract-release.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/invoice-escrow
      - run: cargo test --locked --manifest-path contracts/invoice-escrow/Cargo.toml
      - name: Bind release tag to the tested branch commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ github.run_id }}
        run: |
          TAG="escrow-v2-testnet-${SOURCE_RUN}_contracts_invoice_escrow_invoice-escrow_pkg0.2.0_cli28.1.0"
          if EXISTING=$(gh api "repos/${SOURCE_REPO}/git/ref/tags/${TAG}" --jq .object.sha 2>/dev/null); then
            test "$EXISTING" = "$SOURCE_SHA"
          else
            gh api "repos/${SOURCE_REPO}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${SOURCE_SHA}"
          fi
  release:
    needs: test
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@6b16426dd3a61715ddddf83a2df322a6371fe071
    with:
      release_name: escrow-v2-testnet-${{ github.run_id }}
      release_description: Testnet escrow v2 source verification; no Mainnet deployment.
      relative_path: contracts/invoice-escrow
      package: invoice-escrow
      home_domain: centerp.vercel.app
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
